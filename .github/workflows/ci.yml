name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: check (lint, build, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run project gate (bun run check)
        run: bun run check
